# Full SFT on XML format dataset (with chat_template_kwargs masking)
# Direct counterpart to sft_json_full.toml for the XML-vs-JSON comparison.
output_dir = "../environments/env_2048_single_turn/sft_outputs_xml_full"
max_steps = 200

[deployment]
num_gpus = 2

[ckpt]
interval = 50

[model]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
type = "sft"
name = "../environments/env_2048_single_turn/sft_data_xml_parquet"
seq_len = 512
batch_size = 64

[data.loss_mask]
system = false
user = false
assistant = true

[optim]
lr = 2e-5

[scheduler]
type = "cosine"
warmup_steps = 20
